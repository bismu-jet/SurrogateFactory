apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surrogate-model-pvc
  labels:
    app.kubernetes.io/name: surrogate-factory
    app.kubernetes.io/component: model-storage
spec:
  accessModes:
    # ReadWriteOnce: a single node mounts the model; use ReadOnlyMany to share it across nodes.
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
